# Homelab's defaults. Don't change them here: put your own value in /etc/homelab/homelab.conf,
# which is read after this file and wins. An update can improve these.
SIZE=1280x720
FPS=15
# Motion (mjpg-streamer's motion plugin; long names only, -l doesn't work):
#   --motion      how much of the picture must change, in % (lower: more sensitive)
#   --overload    more than this changing at once is the light, not someone (ignored)
#   --sequence    frames in a row          --nframe    check every nth frame
#   --downscale   shrink it first           --cooldown  seconds between photos
#   --zones       watch only parts of the picture (README)
MOTION="--downscale 4 --motion 5 --overload 90 --sequence 2 --nframe 2 --cooldown 10"
# Each alarm comes with BURST more frames, a second apart, on the page. While something keeps
# moving, a photo every --cooldown seconds goes to the page, and your phone gets an alarm at most
# every ALARM_EVERY seconds. Movement in the first WARMUP seconds after the camera starts is its
# light settling, not someone: ignored.
BURST=2
ALARM_EVERY=120
WARMUP=10
# Motion photos older than this many days are deleted.
KEEP_DAYS=7
