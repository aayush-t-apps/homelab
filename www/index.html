<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Homelab</title>
<style>
  :root {
    --wall: #eef1ec; --panel: #e2e7df; --ink: #1e2b25; --muted: #5e6b64;
    --ok: #2f7a4a; --alert: #b3261e; --brass: #8a6a22;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #0e1720; --panel: #16222e; --ink: #e4eaee; --muted: #93a1ab;
      --ok: #5fc28a; --alert: #ff8a80; --brass: #d8b266;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--wall); color: var(--ink);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 14px; }
  .checked { color: var(--muted); font-size: 14px; }
  .view {
    position: relative; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden;
    background: var(--panel);
  }
  .picture { all: unset; display: block; width: 100%; height: 100%; cursor: pointer; }
  .picture:focus-visible { outline: 3px solid var(--brass); outline-offset: -3px; border-radius: 18px; }
  .picture img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .badge {
    position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 7px;
    padding: 4px 10px 4px 9px; border-radius: 999px; font-size: 14px; font-weight: 600;
    color: #fff; background: rgb(0 0 0 / 0.45);
  }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff5a4f; }
  @media (prefers-reduced-motion: no-preference) {
    .badge::before { animation: beat 2s ease-in-out infinite; }
    @keyframes beat { 50% { opacity: 0.35; } }
  }
  .quiet {
    position: absolute; inset: 0; display: grid; align-content: center; gap: 6px;
    padding: 24px; text-align: center; color: var(--muted);
  }
  .quiet strong { font-size: 20px; color: var(--ink); }
  .quiet.alert strong { color: var(--alert); }
  .view + .camera { margin-top: 14px; }
  .camera { padding: 14px 14px 14px 18px; border-radius: 16px; background: var(--panel);
    display: flex; align-items: center; gap: 12px;
  }
  .dot { flex: none; align-self: flex-start; margin-top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .dot.offline { background: var(--alert); }
  .camera p { margin: 0; flex: 1; }
  .camera small { display: block; color: var(--muted); font-size: 15px; }
  .camera button {
    flex: none; font: inherit; font-weight: 650; border: 0; border-radius: 999px; padding: 10px 18px;
    background: var(--ink); color: var(--wall); cursor: pointer;
  }
  .camera button:disabled { opacity: 0.55; cursor: progress; }
  .camera button:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .error { margin: 12px 2px 0; color: var(--alert); font-size: 15px; }
  .photos-head { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 12px; }
  h2 { font-size: 20px; font-weight: 700; margin: 0; }
  .photos-head span { color: var(--muted); font-size: 15px; }
  .photos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 10px; }
  @media (min-width: 560px) { .photos { grid-template-columns: repeat(3, 1fr); } }
  .photos a { display: block; color: inherit; text-decoration: none; border-radius: 12px; }
  .photos img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--panel); }
  .photos time { display: block; margin-top: 5px; font-size: 14px; color: var(--brass); }
  .empty { color: var(--muted); margin: 0; }
  a:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Homelab</h1>
    <span class="checked" id="checked"></span>
  </header>

  <div class="view" id="view">
    <button class="picture" id="picture" type="button" aria-label="Watch smoothly (uses more data)" hidden>
      <img id="stream" alt="The camera, live">
    </button>
    <span class="badge" id="live" hidden>Live</span>
    <div class="quiet" id="quiet">
      <strong id="quiet-title">Checking the camera…</strong>
      <span id="quiet-note"></span>
    </div>
  </div>

  <div class="camera">
    <span class="dot" id="dot"></span>
    <p><span id="state">Checking the camera…</span><small id="note"></small></p>
    <button type="button" id="switch" hidden></button>
  </div>
  <p class="error" id="error" hidden></p>

  <div class="photos-head">
    <h2>Motion photos</h2>
    <span id="today"></span>
  </div>
  <ul class="photos" id="photos"></ul>
  <p class="empty" id="empty" hidden>No motion photos yet. While the camera is on, each movement's photo shows here and on your phone.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const clock = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  // A photo's name is when it was taken: 20261013_143025_motion_12.3%.jpg
  function taken(name) {
    const m = name.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
    return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
  }
  function when(d) {
    const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
    const day = days === 0 ? "Today" : days === 1 ? "Yesterday"
      : d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
    return `${day}, ${clock(d)}`;
  }

  // What we know: the switch (camera.json, at once) and the minute check (status.json).
  let switched = null, status = null, seen = false, problem = "";

  // The live view: a new picture every second, light on mobile data; tap it for the smooth
  // stream. Only while the camera is on and the page is showing; tried again if it drops.
  let watching = false, smooth = false, timer = 0, misses = 0;
  const view = $("stream");
  function next() {
    clearTimeout(timer);
    if (!watching || document.hidden) { view.removeAttribute("src"); return; }
    if (smooth) { view.src = `/stream?${Date.now()}`; return; }
    const img = new Image();
    img.onload = () => {
      misses = 0; view.src = img.src; timer = setTimeout(next, 1000);
      if (!seen) { seen = true; render(); }
    };
    // The camera gives each picture to whoever asks first: ask again soon, slow down if it keeps failing.
    img.onerror = () => { timer = setTimeout(next, ++misses < 5 ? 300 : 5000); };
    img.src = `/snapshot?${Date.now()}`;
  }
  view.addEventListener("error", () => { if (smooth && watching) timer = setTimeout(next, 5000); });
  $("picture").addEventListener("click", () => {
    smooth = !smooth;
    $("live").textContent = smooth ? "Live, smooth" : "Live";
    $("picture").setAttribute("aria-label", smooth ? "Back to one picture a second" : "Watch smoothly (uses more data)");
    next();
  });
  document.addEventListener("visibilitychange", next);

  function render() {
    const on = switched ? switched.camera === "on" : status ? status.camera !== "off" : null;
    if (on === null) return;
    // The minute check counts only if it ran since the last switch.
    const fresh = status && (!switched || new Date(status.updated) >= new Date(switched.since));
    const health = !on ? "off" : seen ? "live" : fresh && status.camera === "offline" ? "offline"
      : fresh && status.camera === "live" ? "live" : "starting";
    const since = fresh && status.camera === health ? new Date(status.since) : switched ? new Date(switched.since) : null;
    const at = since ? ` since ${when(since)}` : "";

    if (watching !== (health === "live" || health === "starting")) {
      watching = !watching;
      if (!watching) seen = false;
      next();
    }
    $("view").hidden = health === "off"; // off: nothing to show
    $("picture").hidden = $("live").hidden = health !== "live";
    $("quiet").hidden = health === "live";
    $("quiet").className = health === "offline" ? "quiet alert" : "quiet";
    $("dot").className = `dot ${health}`;

    const text = {
      live: [`Camera on${at}.`, "Each movement sends a photo to your phone."],
      starting: ["Camera on.", "Starting…"],
      offline: [`Camera offline${at}.`, "You heard about it once; you'll hear again when it's back."],
      off: [`Camera off${at}.`, "It isn't in use: nothing is seen or saved. Turn it on when you leave."],
    }[health];
    $("state").textContent = text[0];
    $("note").textContent = problem || text[1];
    $("quiet-title").textContent = { starting: "Starting the camera…", offline: "Camera offline", off: "Camera off" }[health] || "";
    $("quiet-note").textContent = health === "offline"
      ? `${status && status.note ? status.note[0].toUpperCase() + status.note.slice(1) + ". " : ""}It restarts by itself; if it's unplugged, plug it back in.`
      : "";
    const b = $("switch");
    b.hidden = false; b.disabled = false;
    b.textContent = on ? "Turn off" : "Turn on";
  }

  $("switch").addEventListener("click", async () => {
    const to = $("switch").textContent === "Turn on" ? "on" : "off", b = $("switch");
    b.disabled = true; b.textContent = to === "on" ? "Turning on…" : "Turning off…";
    try {
      const r = await fetch(`/api/camera/${to}`, { method: "POST", headers: { "X-Homelab": "1" } });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `the switch answered ${r.status}`);
      switched = body; problem = ""; seen = false;
    } catch (e) {
      problem = `Didn't switch: ${e.message}. Try again.`;
    }
    render();
  });

  async function refresh() {
    try {
      const [s, c] = await Promise.all([
        fetch(`/data/status.json?${Date.now()}`, { cache: "no-store" }),
        fetch(`/data/camera.json?${Date.now()}`, { cache: "no-store" }),
      ]);
      if (!s.ok) throw new Error(s.status);
      status = await s.json();
      if (c.ok) switched = await c.json();
    } catch {
      $("state").textContent = "Can't reach home.";
      $("note").textContent = "Check that Tailscale is on, then reload.";
      $("dot").className = "dot offline";
      return;
    }
    render();
    $("checked").textContent = `Checked ${clock(new Date(status.updated))}`;
    $("today").textContent = status.motion_today ? `${status.motion_today} today` : "";

    const err = status.alarm_error && status.alarm_error.match(/^(\S+) (?:alarm: )?(.*)$/s);
    $("error").hidden = !err;
    if (err) $("error").textContent = `The last alarm didn't reach your phone (${clock(new Date(err[1]))}): ${err[2]}. The next one tries again.`;

    $("photos").replaceChildren(...status.photos.map((name) => {
      const d = taken(name), url = `/data/motion/${encodeURIComponent(name)}`;
      const li = document.createElement("li"), a = document.createElement("a"), img = document.createElement("img"), t = document.createElement("time");
      a.href = url; img.src = url; img.loading = "lazy"; img.alt = d ? `Motion, ${when(d)}` : "Motion";
      if (d) { t.dateTime = d.toISOString(); t.textContent = when(d); }
      a.append(img, t); li.append(a);
      return li;
    }));
    $("empty").hidden = status.photos.length > 0;
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
